[project]
name = "wildai"
version = "0.1.0"
description = "Scaling laws for wild AI-generated web text in pretraining data: data pipeline, training, evaluation, law fitting and paper figures."
readme = "README.md"
license = "CC-BY-NC-SA-4.0"
license-files = ["LICENSE", "src/wildai/training/NOTICE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "pydantic>=2.7",
    "pyarrow>=16",
    "pyyaml>=6",
]

[project.optional-dependencies]
# figures and tables of the paper (pinned so the figures come out pixel-identical)
paper = ["matplotlib==3.10.9", "pillow>=10"]
# training and evaluating the models (nanochat recipe; FA3 kernels on Hopper, SDPA elsewhere)
train = [
    "torch==2.9.1",
    "kernels==0.11.7",
    "rustbpe>=0.1.0",
    "tiktoken>=0.11.0",
    "tokenizers>=0.22.0",
    "datasets>=4.0.0",
    "huggingface-hub>=0.34.4",
    "zstandard>=0.23.0",
    "psutil>=7.1.0",
    "filelock>=3.13",
    "jinja2>=3.1",
]
# exporting checkpoints to Hugging Face
hub = ["safetensors>=0.4", "transformers>=4.56"]
# sampling FineWeb, building pools and evaluation sets, web measurements, dataset export
# (running the Common Crawl recipe itself needs the separate environment described in src/wildai/data/collect/recipe.py)
data = ["tokenizers>=0.22.0", "huggingface-hub>=0.34.4", "datasets>=4.0.0", "fsspec[http]>=2023.1.0,<=2026.6.0", "requests>=2.32"]
# labeling: the public Pangram API, EditLens and WebOrganizer classifiers (torch pinned with bitsandbytes and xformers)
label = [
    "requests>=2.32",
    "torch==2.9.1",
    "transformers>=5,<6",
    "peft==0.21.0",
    "bitsandbytes==0.50.2",
    "accelerate>=1.0",
    "emoji==2.16.0",
    "xformers==0.0.33.post2",
]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wildai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running (deselect with '-m \"not slow\"')", "gpu: needs a CUDA GPU"]

[tool.ruff]
line-length = 180
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "ISC", "RUF"]
ignore = ["B905", "RUF001", "RUF002", "RUF003", "ISC004"]  # zip(strict=), the × and – that label figures, and long LaTeX strings split across lines in lists
