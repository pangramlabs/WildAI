# The monthly measurement sample (python -m wildai.data.monthly_sample): 5,000 documents per crawl month, 62 months.
#
# FineWeb months (January 2021 to June 2025) are read from Hugging Face FineWeb v1.4.0; a month is the capture month of
# its documents, so one crawl can serve two months (and May 2025 draws on two crawls). Six calendar months have no
# crawl. From July 2025 on, each month is its own crawl, read from 32 WARC files drawn uniformly from the whole crawl and
# run through the FineWeb recipe. A month's seed is its frame's seed plus YYYYMM; it keys the document draw and the
# bootstrap interval of its AI share.

documents_per_month: 5000
fineweb_revision: 9bb295ddab0e05d785b879661af7260fed5140fc
fineweb_pool_factor: 4
warc_files_per_crawl: 32
recipe:
  batch_files: 8
  extraction_timeout: 0.1
  minhash: true
  pii: true
  min_chars: 200

frames:
  - source: fineweb
    seed: 20260917
    months:
      "2021-01": [CC-MAIN-2021-04]
      "2021-02": [CC-MAIN-2021-10]
